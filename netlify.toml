[build]
  publish = "."
  functions = "netlify/functions"

[[edge_functions]]
  function = "product-seo"
  path = "/product/*"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/product/*"
  to = "/index.html"
  status = 200
  force = true
